name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的发布 tag（例如 v0.1.0）；用于补传资产
        required: true
        type: string

permissions:
  contents: write

# 发布串行化：补传资产与打 tag 触发不会并发覆盖同一批资产。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag push 时按 tag 检出；手动补跑时按输入的 tag 检出。
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tag 是唯一发布入口，且必须与源码常量一致（docs/002 §1.1）。
      - name: Resolve tag, version and commit
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须是 vX.Y.Z：$TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          SRC_VERSION="$(sed -nE 's/^const Version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/version/version.go)"
          if [[ -z "$SRC_VERSION" ]]; then
            echo "::error::无法从 internal/version/version.go 提取 Version"
            exit 1
          fi
          if [[ "$SRC_VERSION" != "$VERSION" ]]; then
            echo "::error::tag $TAG 与 internal/version.Version $SRC_VERSION 不一致（docs/002 §1.1）"
            exit 1
          fi

          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --force
          COMMIT="$(git rev-parse "${TAG}^{commit}")"
          git fetch origin main
          if ! git merge-base --is-ancestor "$COMMIT" FETCH_HEAD; then
            echo "::error::$TAG 指向的提交不在 origin/main 上"
            exit 1
          fi

          # Android versionCode 由 tag 派生：major*10000 + minor*100 + patch（v0.5.3 → 503）。
          # 必须跨版本严格递增，否则 Android 拒绝覆盖安装。
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::versionCode 越界：$VERSION_CODE"
            exit 1
          fi

          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "COMMIT=$COMMIT"
            echo "SHORT_SHA=${COMMIT:0:12}"
          } >> "$GITHUB_OUTPUT"
          echo "发布 $TAG：版本 $VERSION，versionCode $VERSION_CODE，提交 ${COMMIT:0:12}"

      # 完整分层 / 浏览器内核 / 隐私检查由 ci.yml 负责，靠「tag 必须在 main 上」兜底。
      - name: Quality gates
        env:
          SENSITIVE_VALUES: ${{ vars.SENSITIVE_VALUES }}
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

          # 与 ci.yml 同一口径：已知真实敏感值由仓库变量提供，未配置时只做占位模板自检。
          patterns='<把已知的真实学号/房间号写在这里>'
          if [[ -n "${SENSITIVE_VALUES:-}" ]]; then
            patterns="$SENSITIVE_VALUES"
          fi
          printf '%s\n' "$patterns" | while IFS= read -r value; do
            [[ -z "$value" ]] && continue
            if grep -rniF -e "$value" . \
                --exclude-dir=.git \
                --exclude=ci.yml --exclude=release.yml --exclude=AGENTS.md --exclude=CONTRIBUTING.md; then
              echo 'FAIL: personal data found'; exit 1
            fi
          done
          echo 'privacy scan OK'

      # TODO(D13): NDK / gomobile 工具链仍是待确认项；此处按 android/README.md 的描述性基线落地。
      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android-gomobile

      - name: Build assets
        env:
          VERSION: ${{ steps.meta.outputs.VERSION }}
          VERSION_CODE: ${{ steps.meta.outputs.VERSION_CODE }}
          COMMIT: ${{ steps.meta.outputs.COMMIT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PY="$(command -v python3 2>/dev/null || true)"
          if [[ -z "$PY" ]] || ! "$PY" -c 'import sys; sys.exit(0)' > /dev/null 2>&1; then
            PY="$(command -v python)"
          fi
          rm -rf dist
          mkdir -p dist

          cat > dist/INSTALL.txt <<'EOF'
          kemaolife —— CLI 安装说明（Linux / macOS 预编译包）

          本包是 Linux 或 macOS（darwin amd64 / arm64）预编译产物；桌面端仍仅 Windows 托盘，
          移动端仍仅 Android。macOS 包由 Linux CI 交叉编译，未经 Apple Developer ID 签名与公证，
          且 macOS CLI 未经过实机测试，按试验性支持使用（见下「关于 macOS」）。

          包内文件：
            kemaolife     纯 Go 二进制（CGO_ENABLED=0），不依赖第三方运行时
            LICENSE       MIT 许可证
            INSTALL.txt   本文件

          安装（在下载目录执行，把压缩包名换成自己下载的架构）：
            Linux：sha256sum -c SHA256SUMS --ignore-missing
            macOS：shasum -a 256 <压缩包名>，把结果与 SHA256SUMS 中对应行比对
            tar -xzf kemaolife_<版本>_linux_<架构>.tar.gz
            mkdir -p ~/.local/bin
            install -m 0755 kemaolife ~/.local/bin/kemaolife
            kemaolife --version
            kemaolife config init

          config init 交互录入学号与教务密码，配置文件权限 0600。首次查询前可用
          kemaolife --json timetable sync 生成一次快照；日常查询每次自动刷新，失败时
          回落旧快照并标 stale:true。电费数据约 1 天延迟，输出中的「数据截至」不是实时值。

          关于 macOS：下载 kemaolife_<版本>_darwin_arm64.tar.gz（Apple Silicon / M1 及以后）
          或 kemaolife_<版本>_darwin_amd64.tar.gz（Intel Mac），解压后与 Linux 同样安装到
          ~/.local/bin。包内文件与 Linux 包一致：kemaolife / LICENSE / INSTALL.txt。
          macOS 没有 sha256sum，用 shasum 计算后与 SHA256SUMS 中对应行比对，再执行：
            shasum -a 256 kemaolife_<版本>_darwin_<架构>.tar.gz
            tar -xzf kemaolife_<版本>_darwin_<架构>.tar.gz
            xattr -d com.apple.quarantine kemaolife
            mkdir -p ~/.local/bin && install -m 0755 kemaolife ~/.local/bin/kemaolife
          xattr 仅用于清除浏览器下载的隔离属性；若系统未提示 Gatekeeper 拦截可跳过，
          不要对来历不明的二进制执行此操作。也可按需用 Go 1.24+ 源码自行构建：
          go build -o kemaolife ./cmd/kemaolife。
          macOS 二进制由 Linux CI 交叉编译，未经 Apple Developer ID 签名、未经 Apple 公证；
          arm64 包带 Go 链接器自动生成的 ad-hoc 代码签名（Apple Silicon 要求），不等于 Apple 签名。
          macOS CLI 未经过实机测试：darwin amd64 / arm64 只完成交叉编译、静态审查与自动化单测，
          未在真实 Mac 上运行；真实终端回显控制、Gatekeeper quarantine、根证书链、本地时区
          与 arm64 首次执行均未实机确认，请按试验性支持使用。
          凭据与缓存沿用 ~/.config/kemaolife/config.json（目录 0700 /
          文件 0600 / 原子写，XDG 环境变量优先）与 ~/.cache/kemaolife/；config init 默认关闭
          回显，用 BSD termios（TIOCGETA / TIOCSETA），不引 Keychain 或 golang.org/x/term；
          终端不支持关闭回显时会先在 stderr 明确警告「输入可能被看到」再继续读取；命令与
          输出、退出码与 Linux 完全一致。windows CLI 为后续计划，不在本期。

          agent skill 单独发布为 kemaolife-skill_<版本>.zip，解压后把 kemaolife/ 放进
          agent 的 skills 目录；skill 不含二进制，也不含凭据。skill 存放位置（D2）尚未
          定稿，由使用者决定。

          本工具只查本人数据；CLI 不提供校园网状态查询，也不存校园网凭据。请勿在
          Issue / 交流群提交学号、密码、Cookie 或课表快照。
          EOF

          build_one() {
            arch="$1"
            goarch="$2"
            goarm="${3:-}"
            stage="dist/stage/${arch}"
            mkdir -p "$stage"
            cp LICENSE "$stage/LICENSE"
            cp dist/INSTALL.txt "$stage/INSTALL.txt"

            build_env=(CGO_ENABLED=0 GOOS=linux "GOARCH=${goarch}")
            if [[ -n "$goarm" ]]; then
              build_env+=("GOARM=${goarm}")
            fi
            # 版本号取源码常量，不注入；只注入构建提交（docs/002 §1.1）。
            env "${build_env[@]}" go build -trimpath \
              -ldflags "-s -w -X main.commit=${COMMIT}" \
              -o "$stage/kemaolife" ./cmd/kemaolife
            chmod 0755 "$stage/kemaolife"
            tar -czf "dist/kemaolife_${VERSION}_linux_${arch}.tar.gz" \
              -C "$stage" kemaolife LICENSE INSTALL.txt
          }

          build_one amd64 amd64
          build_one arm64 arm64
          build_one armv7 arm 7

          # macOS 预编译包：darwin amd64 / arm64，与 Linux 包同构（三文件 tar.gz）。
          # 二进制由 Linux runner 交叉编译，无 Apple Developer ID 签名与公证；arm64 带
          # Go 链接器自动生成的 ad-hoc 代码签名（Apple Silicon 要求），校验见 Verify assets。
          build_darwin() {
            arch="$1"
            goarch="$2"
            stage="dist/darwin-stage/${arch}"
            mkdir -p "$stage"
            cp LICENSE "$stage/LICENSE"
            cp dist/INSTALL.txt "$stage/INSTALL.txt"

            env CGO_ENABLED=0 GOOS=darwin "GOARCH=${goarch}" go build -trimpath \
              -ldflags "-s -w -X main.commit=${COMMIT}" \
              -o "$stage/kemaolife" ./cmd/kemaolife
            chmod 0755 "$stage/kemaolife"
            tar -czf "dist/kemaolife_${VERSION}_darwin_${arch}.tar.gz" \
              -C "$stage" kemaolife LICENSE INSTALL.txt
          }

          build_darwin amd64 amd64
          build_darwin arm64 arm64

          # Windows 便携包：amd64 / arm64。GUI 子系统是形态要求（docs/002 §5.2），
          # 漏掉 -H=windowsgui 会挂控制台窗口，不符合托盘常驻形态。
          build_win() {
            arch="$1"
            goarch="$2"
            stage="dist/win-stage/${arch}"
            mkdir -p "$stage"
            env CGO_ENABLED=0 GOOS=windows "GOARCH=${goarch}" go build -trimpath \
              -ldflags "-s -w -H=windowsgui -X main.commit=${COMMIT}" \
              -o "$stage/kemaolife-agent.exe" ./cmd/kemaolife-agent
            cp LICENSE "$stage/LICENSE"
            cp packaging/windows/INSTALL.txt "$stage/INSTALL.txt"
            cp packaging/windows/install.ps1 "$stage/install.ps1"
            cp packaging/windows/uninstall.ps1 "$stage/uninstall.ps1"
            cp packaging/windows/install.bat "$stage/install.bat"
            cp packaging/windows/uninstall.bat "$stage/uninstall.bat"
            # 行尾 / BOM 由 .gitattributes 保证（packaging/windows/* eol=crlf）；
            # 这里只做断言，避免 checkout 被改配置后在包里静默产出 LF 版脚本。
            for f in install.bat uninstall.bat install.ps1 uninstall.ps1; do
              if grep -qU $'\r' "$stage/$f"; then :; else
                echo "::error::$f 缺少 CRLF 行尾（检查 .gitattributes）"; exit 1
              fi
            done
            if ! head -c 3 "$stage/install.ps1" | od -An -tx1 | grep -q 'ef bb bf'; then
              echo "::error::install.ps1 缺少 UTF-8 BOM（PowerShell 5.1 会按 ANSI 解码中文）"; exit 1
            fi
          }

          build_win amd64 amd64
          build_win arm64 arm64

          "$PY" - <<'PY'
          import os, zipfile

          version = os.environ["VERSION"]
          entries = ("kemaolife-agent.exe", "install.bat", "install.ps1",
                     "uninstall.bat", "uninstall.ps1", "LICENSE", "INSTALL.txt")
          for arch in ("amd64", "arm64"):
              out = f"dist/kemaolife-agent_{version}_windows_{arch}.zip"
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  for name in entries:
                      z.write(f"dist/win-stage/{arch}/{name}", name)
              print(out)
          PY

          # Android：按 ABI 出 4 个已签名 release APK。签名密钥由 GitHub Secrets 注入，
          # 跨 release 复用同一把私钥，保证用户能直接覆盖安装而不丢 Keystore 凭据 / 快照。
          : "${ANDROID_KEYSTORE_BASE64:?缺少 Secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?缺少 Secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?缺少 Secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?缺少 Secret ANDROID_KEY_PASSWORD}"
          : "${KEMAOLIFE_BUILD_TOOLS:?未定位 Android build-tools}"

          KS="${RUNNER_TEMP}/kemaolife-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          export KEMAOLIFE_KEYSTORE_FILE="$KS"
          echo "KEMAOLIFE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

          (
            cd android
            bash ./gradlew --no-daemon :app:assembleRelease "-PversionCode=${VERSION_CODE}"
          )

          APK_DIR="android/app/build/outputs/apk/release"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="${APK_DIR}/app-${abi}-release.apk"
            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 Android 产物 $src"
              find "$APK_DIR" -maxdepth 1 -type f || true
              exit 1
            fi
            cp "$src" "dist/kemaolife_${VERSION}_android_${abi}.apk"
          done

          APKSIGNER="${KEMAOLIFE_BUILD_TOOLS}/apksigner"
          CERT_SHA256=""
          for apk in dist/kemaolife_${VERSION}_android_*.apk; do
            "$APKSIGNER" verify --min-sdk-version 24 "$apk" > /dev/null
            # 某些 build-tools 版本把 --print-certs 结果写到 stderr，统一并流后再取值；
            # tr -d '\r' 避免 Windows 构建工具输出 CRLF 时留下尾随回车。
            fp="$("$APKSIGNER" verify --print-certs "$apk" 2>&1 | tr -d '\r' \
              | sed -nE 's/^Signer #1 certificate SHA-256 digest: *(.+)$/\1/p' | head -1)"
            if [[ -z "$fp" ]]; then
              echo "::error::无法读取 $apk 的签名证书指纹"
              exit 1
            fi
            if [[ -z "$CERT_SHA256" ]]; then
              CERT_SHA256="$fp"
            elif [[ "$CERT_SHA256" != "$fp" ]]; then
              echo "::error::四个 APK 的签名证书不一致"
              exit 1
            fi
          done
          echo "ANDROID_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "Android 签名证书 SHA-256：$CERT_SHA256"

          mkdir -p dist/skill/kemaolife
          cp skills/kemaolife/SKILL.md dist/skill/kemaolife/SKILL.md
          cat > dist/skill/kemaolife/README.txt <<'EOF'
          kemaolife agent skill

          包内文件：
            kemaolife/SKILL.md      skill 正文（与仓库 skills/kemaolife/SKILL.md 一致）
            kemaolife/README.txt    本文件

          安装：解压后把 kemaolife/ 整个目录放进所用 agent 的 skills 目录。
          skill 依赖同机已安装的 kemaolife 二进制，本身不含二进制、不含凭据，
          也不会写入任何配置。所有查询固定带 --json，只读 stdout。

          skill 存放位置（D2）仍是待确认项，由使用者自行决定，本包不指定安装路径。
          二进制与校验和见同版 Release 的 kemaolife_<版本>_linux_<架构>.tar.gz
          （Linux）、kemaolife_<版本>_darwin_<架构>.tar.gz（macOS，darwin amd64 / arm64）
          与 SHA256SUMS；skill 本身不含二进制。macOS 包未经 Apple Developer ID 签名与公证，
          且 macOS CLI 未经过实机测试，按试验性支持使用。
          EOF

          "$PY" - <<'PY'
          import os, zipfile

          version = os.environ["VERSION"]
          out = f"dist/kemaolife-skill_{version}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for name in ("SKILL.md", "README.txt"):
                  z.write(f"dist/skill/kemaolife/{name}", f"kemaolife/{name}")
          print(out)
          PY

          (cd dist && sha256sum \
            "kemaolife_${VERSION}_linux_amd64.tar.gz" \
            "kemaolife_${VERSION}_linux_arm64.tar.gz" \
            "kemaolife_${VERSION}_linux_armv7.tar.gz" \
            "kemaolife_${VERSION}_darwin_amd64.tar.gz" \
            "kemaolife_${VERSION}_darwin_arm64.tar.gz" \
            "kemaolife-agent_${VERSION}_windows_amd64.zip" \
            "kemaolife-agent_${VERSION}_windows_arm64.zip" \
            "kemaolife_${VERSION}_android_armeabi-v7a.apk" \
            "kemaolife_${VERSION}_android_arm64-v8a.apk" \
            "kemaolife_${VERSION}_android_x86.apk" \
            "kemaolife_${VERSION}_android_x86_64.apk" \
            "kemaolife-skill_${VERSION}.zip" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Verify assets
        env:
          VERSION: ${{ steps.meta.outputs.VERSION }}
          COMMIT: ${{ steps.meta.outputs.COMMIT }}
        run: |
          set -euo pipefail
          PY="$(command -v python3 2>/dev/null || true)"
          if [[ -z "$PY" ]] || ! "$PY" -c 'import sys; sys.exit(0)' > /dev/null 2>&1; then
            PY="$(command -v python)"
          fi
          (cd dist && sha256sum -c SHA256SUMS)

          # Android 四个包逐一验证 v2/v3 签名，且证书指纹必须与发版时记录的一致。
          : "${KEMAOLIFE_BUILD_TOOLS:?未定位 Android build-tools}"
          : "${ANDROID_CERT_SHA256:?未记录 Android 签名证书指纹}"
          APKSIGNER="${KEMAOLIFE_BUILD_TOOLS}/apksigner"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="dist/kemaolife_${VERSION}_android_${abi}.apk"
            test -s "$apk"
            "$APKSIGNER" verify --min-sdk-version 24 "$apk" > /dev/null
            fp="$("$APKSIGNER" verify --print-certs "$apk" 2>&1 | tr -d '\r' \
              | sed -nE 's/^Signer #1 certificate SHA-256 digest: *(.+)$/\1/p' | head -1)"
            if [[ -z "$fp" || "$fp" != "$ANDROID_CERT_SHA256" ]]; then
              echo "::error::$apk 签名证书指纹与发版记录不一致"
              exit 1
            fi
          done
          echo 'Android APK signature OK'

          # 读 ELF 头判架构，避免依赖 file 的输出文案；二进制按 CGO_ENABLED=0 构建。
          "$PY" - <<'PY'
          import os, struct

          version = os.environ["VERSION"]
          expected = {"amd64": (2, 62), "arm64": (2, 183), "armv7": (1, 40)}
          for arch, (ei_class, e_machine) in expected.items():
              path = f"dist/stage/{arch}/kemaolife"
              with open(path, "rb") as f:
                  head = f.read(20)
              assert head[:4] == b"\x7fELF", (path, "not ELF")
              assert head[4] == ei_class and head[5] == 1, (path, "class/endian")
              machine = struct.unpack_from("<H", head, 18)[0]
              assert machine == e_machine, (path, machine)
              print(f"{arch}: ELF class={head[4]} machine={machine} OK")

          for arch in expected:
              with __import__("tarfile").open(f"dist/kemaolife_{version}_linux_{arch}.tar.gz") as t:
                  names = sorted(m.name for m in t.getmembers())
              assert names == ["INSTALL.txt", "LICENSE", "kemaolife"], (arch, names)

          # macOS 包读 Mach-O 头判 CPU 类型与代码签名。纯 Go 二进制不依赖系统动态库；
          # arm64 必须带 Go 链接器自动生成的 LC_CODE_SIGNATURE（ad-hoc），否则 Apple Silicon
          # 首次执行会被系统拒绝；amd64 无该 load command 是正常现象。
          # 这里只校验结构与 ad-hoc 段，不代表经过 Apple Developer ID 签名或公证。
          darwin_expected = {
              "amd64": (0x01000007, False),
              "arm64": (0x0100000C, True),
          }
          for arch, (cpu_type, want_signature) in darwin_expected.items():
              path = f"dist/darwin-stage/{arch}/kemaolife"
              with open(path, "rb") as f:
                  head = f.read(32)
              assert struct.unpack_from("<I", head, 0)[0] == 0xFEEDFACF, (path, "not Mach-O 64-bit")
              found = struct.unpack_from("<I", head, 4)[0]
              assert found == cpu_type, (path, hex(found))
              ncmds, sizeofcmds = struct.unpack_from("<II", head, 16)
              with open(path, "rb") as f:
                  body = f.read(32 + sizeofcmds)
              off, cmds = 32, []
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from("<II", body, off)
                  cmds.append(cmd)
                  off += size
              has_signature = 0x1D in cmds  # LC_CODE_SIGNATURE
              assert has_signature == want_signature, (path, cmds)
              print(f"darwin {arch}: Mach-O cpu={hex(found)} ad-hoc-signature={has_signature} OK")

              with __import__("tarfile").open(
                      f"dist/kemaolife_{version}_darwin_{arch}.tar.gz") as t:
                  names = sorted(m.name for m in t.getmembers())
              assert names == ["INSTALL.txt", "LICENSE", "kemaolife"], (arch, names)

          # Windows 包读 PE 头判架构，避免依赖 file 的输出文案。
          win_expected = {"amd64": 0x8664, "arm64": 0xAA64}
          win_entries = sorted(["INSTALL.txt", "LICENSE", "install.bat", "install.ps1",
                                "kemaolife-agent.exe", "uninstall.bat", "uninstall.ps1"])
          for arch, machine in win_expected.items():
              path = f"dist/win-stage/{arch}/kemaolife-agent.exe"
              with open(path, "rb") as f:
                  head = f.read(0x400)
              assert head[:2] == b"MZ", (path, "not PE")
              pe = struct.unpack_from("<I", head, 0x3c)[0]
              assert head[pe:pe+4] == b"PE\x00\x00", (path, "no PE signature")
              found = struct.unpack_from("<H", head, pe + 4)[0]
              assert found == machine, (path, hex(found))
              # GUI 子系统 = 2；写成 console(3) 会多挂一个黑框。
              # Subsystem 在 PE32 与 PE32+ 里都是 optional header +0x44：
              # PE32+ 把 ImageBase 撑到 8 字节，但后面的字段又对齐回来了。
              opt = pe + 24
              magic = struct.unpack_from("<H", head, opt)[0]
              assert magic in (0x10b, 0x20b), (path, hex(magic))
              subsystem = struct.unpack_from("<H", head, opt + 0x44)[0]
              assert subsystem == 2, (path, f"subsystem={subsystem}, want GUI(2)")
              print(f"windows {arch}: PE machine={hex(found)} subsystem={subsystem} OK")

              with __import__("zipfile").ZipFile(
                      f"dist/kemaolife-agent_{version}_windows_{arch}.zip") as z:
                  names = sorted(z.namelist())
                  assert names == win_entries, (arch, names)
                  # .bat 必须是 CRLF，否则 cmd.exe 解析会吃掉行尾。
                  for bat in ("install.bat", "uninstall.bat"):
                      data = z.read(bat)
                      assert data.count(b"\n") == data.count(b"\r\n"), (bat, "bare LF")
                  # .ps1 必须带 UTF-8 BOM：PowerShell 5.1 读无 BOM 的 UTF-8 会按
                  # 系统 ANSI 解码，中文变乱码并触发语法错误。
                  for ps in ("install.ps1", "uninstall.ps1"):
                      data = z.read(ps)
                      assert data.startswith(b"\xef\xbb\xbf"), (ps, "no BOM")
                      assert data.count(b"\n") == data.count(b"\r\n"), (ps, "bare LF")

          with __import__("zipfile").ZipFile(f"dist/kemaolife-skill_{version}.zip") as z:
              names = sorted(z.namelist())
          assert names == ["kemaolife/README.txt", "kemaolife/SKILL.md"], names

          # 每个 ABI 包必须只含自己的 lib/<abi>/*.so，确认 splits 真的生效。
          for abi in ("armeabi-v7a", "arm64-v8a", "x86", "x86_64"):
              path = f"dist/kemaolife_{version}_android_{abi}.apk"
              with __import__("zipfile").ZipFile(path) as z:
                  names = z.namelist()
              assert "AndroidManifest.xml" in names, (path, "no manifest")
              assert any(n == "classes.dex" for n in names), (path, "no dex")
              assert any(n.startswith(f"lib/{abi}/") and n.endswith(".so")
                         for n in names), (path, "missing ABI lib")
              assert not any(n.startswith("lib/") and not n.startswith(f"lib/{abi}/")
                             for n in names), (path, "foreign ABI lib")
              print(f"android {abi}: ABI split OK")
          print("archive contents OK")
          PY

          # --version 不联网、不读配置，amd64 产物可在 runner 直接实跑。
          ./dist/stage/amd64/kemaolife --version
          ./dist/stage/amd64/kemaolife --help > /dev/null
          ./dist/stage/amd64/kemaolife --version --json > dist/version.json
          "$PY" - <<'PY'
          import json, os

          with open("dist/version.json", encoding="utf-8") as f:
              env = json.load(f)
          assert env["ok"] is True, env
          assert env["data"]["version"] == os.environ["VERSION"], env
          assert env["data"]["commit"] == os.environ["COMMIT"], env
          print("version/commit OK")
          PY

      - name: Render release notes
        env:
          TAG: ${{ steps.meta.outputs.TAG }}
          VERSION: ${{ steps.meta.outputs.VERSION }}
          VERSION_CODE: ${{ steps.meta.outputs.VERSION_CODE }}
          SHORT_SHA: ${{ steps.meta.outputs.SHORT_SHA }}
        run: |
          set -euo pipefail
          PY="$(command -v python3 2>/dev/null || true)"
          if [[ -z "$PY" ]] || ! "$PY" -c 'import sys; sys.exit(0)' > /dev/null 2>&1; then
            PY="$(command -v python)"
          fi
          # 下方「本版变更」按当前 tag 撰写；下次发版必须同步替换该段，
          # 避免把旧版说明带进新 Release（docs/002 §9 追加变更记录同口径）。
          cat > dist/RELEASE_NOTES.md <<'EOF'
          ## kemaolife __TAG__

          三端（CLI / Windows 托盘 / Android App）共用一份 Go `core` 的校园工具：课表查询、电费余额与每日用量、校园网认证。本版产物为五类：Linux CLI 纯 Go 二进制（三架构，`CGO_ENABLED=0`）、**macOS CLI 预编译包（darwin amd64 / arm64，`CGO_ENABLED=0`）**、Windows 托盘便携包（两架构）、Android 四 ABI 已签名 APK、独立的 agent skill，另附 `SHA256SUMS`。windows CLI 为后续计划；桌面端仅 Windows、移动端仅 Android。macOS 二进制由 Linux CI 交叉编译，**未经 Apple Developer ID 签名、未经 Apple 公证**，且 **macOS CLI 未经过实机测试**（详见下方安装小节）。源码版本 `internal/version.Version` = `__VERSION__`；Android `versionCode` = `__VERSION_CODE__`；构建提交 `__SHORT_SHA__`（完整提交号见 `kemaolife --version --json`）。

          ### 本版变更（__TAG__，自 v0.5.2）

          本版只改 Android 呈现层，共三项，不含三个功能域的逻辑或对外契约变化：

          **外观：新增「连续曲率圆角」开关**

          - 「设置 → 外观 → 显示与色彩」第三个开关，默认**关闭**使用标准圆弧（`RoundedCornerShape`），开启后全 App 改用连续曲率（`SmoothCornerShape`）；两种模式共用完全相同的半径层级，`MaterialTheme.shapes` 五个槽位、tab1 课程块、连体钮、弹窗与底部弹层都跟随，圆形与连体钮 morph 动效不变。
          - 偏好只存本机 `appearance`，不做升级迁移：从旧版覆盖安装后仍按默认的标准圆弧显示，需要时自行打开开关。

          **关于：新增纯手动「检查更新」**

          - 「设置 → 关于」在 `GitHub` / `开源许可` 之后独立成组新增一行，点击打开半屏底部弹层，展示当前版本、最新发布版本与一句结论，底部常驻「前往 Releases」外链。
          - 只取 GitHub `/releases/latest` 的公开 `tag_name` 与本机 `BuildConfig.VERSION_NAME` 按 `v?X.Y.Z` 白名单做三段数值比较；**不自动检查、不后台定时、不应用内下载或安装 APK**，不展示 Release notes 或资产列表，失败用本地固定文案、不给重试按钮。
          - 该查询走 Kotlin `HttpURLConnection`（JDK 标准库，不新增第三方依赖），只发一次手动请求、走系统 CA，不携带凭据 / Cookie / 学号 / 设备标识，不读本机快照，不经 Go 门面（故不进「设置 → 日志」），上游正文与错误文案不进 UI。

          **课表：修正头部文字被圆角裁切**

          - 日期 / 周次点击区补 8dp 水平内边距，避免默认标准圆弧裁掉贴边的年份与「第」字；点击热区、圆角形状、头部高度与贴顶 / 贴底关系不变。

          > [!NOTE]
          > **从 `0.5.2` 升级**：直接覆盖安装同架构 APK 即可（`versionCode` = `__VERSION_CODE__`），不要先卸载（会清掉 Keystore 凭据与应用私有目录里的快照）；快照 `Version` 未变，不需要重新同步课表。
          >
          > **从 `0.4.1` 或更早版本升级**：`0.5.1` 已把课表快照升到 `Version 2`（修复「同一门课全部教室都显示在当节」与「连堂课时间只覆盖起始大节」），旧快照不做兼容迁移、直接丢弃重拉。请联网打开一次 App（或执行一次 `kemaolife timetable sync`）让课表重新生成；未刷新成功前课表会显示空态或提示需要重新同步。更早版本变更见 [v0.5.1](https://github.com/EchoPing07/kemaolife/releases/tag/v0.5.1) 与 [v0.5.2](https://github.com/EchoPing07/kemaolife/releases/tag/v0.5.2) Release。

          CLI 命令 / 参数 / 退出码 `0/1/2/3/4`、JSON 信封、DTO 字段名、错误码、门面 `op` 与快照 `Version` 均未变；Linux / macOS CLI、Windows 托盘与 agent skill 产物与 `0.5.2` 一致。电费数据仍约 1 天延迟，「数据截至」是采集时刻，不是实时值；三端功能边界与不做项见 `docs/002 §5`。

          ### 产物

          | 端 | 文件 | 适用 |
          |---|---|---|
          | CLI（Linux） | `__ASSET_AMD64__` | x86_64 |
          | CLI（Linux） | `__ASSET_ARM64__` | aarch64 / arm64 |
          | CLI（Linux） | `__ASSET_ARMV7__` | 32 位 ARMv7（`GOARCH=arm GOARM=7`） |
          | CLI（macOS） | `__ASSET_DARWIN_AMD64__` | Intel Mac（x86_64） |
          | CLI（macOS） | `__ASSET_DARWIN_ARM64__` | Apple Silicon（M1 及以后，arm64） |
          | Windows | `__ASSET_WIN_AMD64__` | 64 位 x86（x64）托盘程序 |
          | Windows | `__ASSET_WIN_ARM64__` | Windows on ARM（arm64）托盘程序 |
          | Android | `__ASSET_ANDROID_ARMV7A__` | 32 位 ARM（`armeabi-v7a`） |
          | Android | `__ASSET_ANDROID_ARM64__` | 64 位 ARM（`arm64-v8a`，多数新机） |
          | Android | `__ASSET_ANDROID_X86__` | 32 位 x86 模拟器 / 少量设备 |
          | Android | `__ASSET_ANDROID_X86_64__` | 64 位 x86 模拟器 / 少量设备 |
          | agent skill | `__ASSET_SKILL__` | 单独安装，依赖同机 `kemaolife` 二进制 |
          | — | `SHA256SUMS` | 以上十二个包的校验和 |

          以上十二个包含 macOS 预编译产物。**macOS CLI 未经过实机测试**：darwin amd64 / arm64 仅交叉编译、静态审查与自动化单测通过，未在真实 Mac 上运行；macOS 二进制由 Linux CI 交叉编译，**未经 Apple Developer ID 签名与公证**（arm64 包带 Go 链接器自动生成的 ad-hoc 代码签名，不等于 Apple 签名），请按试验性支持使用。

          Linux 三个 / macOS 两个 CLI 预编译包内含 `kemaolife`、`LICENSE` 与 `INSTALL.txt`；Windows 两个包内含 `kemaolife-agent.exe`（GUI 子系统，无控制台窗口）、`install.bat` / `install.ps1` / `uninstall.bat` / `uninstall.ps1`、`LICENSE` 与 `INSTALL.txt`；Android 四个包是按 ABI 拆分的已签名 release APK，使用 v2 + v3 签名；skill 包内含 `kemaolife/SKILL.md` 与 `kemaolife/README.txt`。

          下载后先核对完整性：Linux 用 `sha256sum -c SHA256SUMS --ignore-missing`；macOS 无 `sha256sum`，用 `shasum -a 256 <文件>` 计算后与 `SHA256SUMS` 中对应行比对；Windows 可用 `certutil -hashfile <文件> SHA256` 比对。

          ### 安装（CLI · Linux 预编译包，amd64 示例）

          ```bash
          sha256sum -c SHA256SUMS --ignore-missing
          tar -xzf __ASSET_AMD64__
          mkdir -p ~/.local/bin
          install -m 0755 kemaolife ~/.local/bin/kemaolife
          kemaolife --version
          kemaolife config init
          ```

          arm64 / armv7 换成对应压缩包即可。`config init` 交互录入学号与教务密码，配置文件权限 `0600`；学校代码内置默认值可用 `config set customercode <学校代码>` 覆盖。

          ### 安装（CLI · macOS 预编译包）

          按芯片下载一个包：Apple Silicon（M1 及以后）选 `__ASSET_DARWIN_ARM64__`，Intel Mac 选 `__ASSET_DARWIN_AMD64__`。先核对 `SHA256SUMS` 再解压（macOS 无 `sha256sum`，用 `shasum -a 256` 计算后与对应行比对）：

          ```bash
          shasum -a 256 __ASSET_DARWIN_ARM64__
          tar -xzf __ASSET_DARWIN_ARM64__
          xattr -d com.apple.quarantine kemaolife
          mkdir -p ~/.local/bin
          install -m 0755 kemaolife ~/.local/bin/kemaolife
          kemaolife --version
          kemaolife config init
          ```

          `xattr -d com.apple.quarantine kemaolife` 用于清除浏览器下载附带的隔离属性；若系统未提示 Gatekeeper 拦截可跳过，**不要对来历不明的二进制执行此操作**。二进制未经 Apple Developer ID 签名与公证，arm64 包带 Go 链接器自动生成的 ad-hoc 代码签名（Apple Silicon 要求），这不等于 Apple 签名。也可按需用 Go 1.24+ 源码自行构建（`go build -o kemaolife ./cmd/kemaolife`）。

          > [!WARNING]
          > **macOS CLI 未经过实机测试**：darwin amd64 / arm64 只完成交叉编译、静态审查与自动化单测，未在真实 Mac 上运行；真实终端回显控制与恢复（`TIOCGETA` / `TIOCSETA`）、Gatekeeper 拦截与 `xattr -d` 处理、系统根证书链下的 HTTPS、`time.Local` 本地时区、Apple Silicon arm64 首次执行均未经实机确认，请按试验性支持使用，遇到问题带 macOS 版本与现象提 Issue。

          配置路径与权限沿用 `~/.config/kemaolife/config.json`（目录 `0700` / 文件 `0600`、原子写，XDG 环境变量优先）与 `~/.cache/kemaolife/`；命令、输出与退出码和 Linux 一致，不引 Keychain 与第三方依赖。

          ### 安装（Windows）

          下载 `__ASSET_WIN_AMD64__`（或 arm64 包），解压到任意目录后双击 `install.bat`。脚本把程序复制到 `%LOCALAPPDATA%\Programs\Kemaolife\`、建开始菜单快捷方式并启动一次，不需要管理员权限。

          卸载双击 `uninstall.bat`：结束进程、删自启项、删快捷方式与安装目录，**保留** `%LOCALAPPDATA%\Kemaolife\` 配置目录（含 DPAPI 加密的学号与凭据）。

          > [!NOTE]
          > Windows 端**没有代码签名**。系统可能提示「Windows 已保护你的电脑」（点「更多信息 → 仍要运行」），
          > 或在开启了 Smart App Control 的 Windows 11 设备上直接拦截（关闭 SAC 后无法重新开启）。
          > 申请免费开源签名的跟进项见 [#4](https://github.com/EchoPing07/kemaolife/issues/4)。

          > [!IMPORTANT]
          > **Windows arm64 版本尚未在 ARM 真机上验证**。可以正常构建，但托盘图标、右键菜单、设置窗口与凭据加解密
          > 都依赖手写的 Win32 结构体布局，未经实机确认。遇到问题请带 Windows 版本与现象提 Issue。

          ### 安装（Android）

          按设备架构下载一个 APK：多数近几年手机选 `__ASSET_ANDROID_ARM64__`；旧 32 位机选 `__ASSET_ANDROID_ARMV7A__`；x86 / x86_64 包主要给模拟器用。系统需 Android 7.0（API 24）及以上。

          直接在手机上打开下载的 APK 即可安装；首次侧载需要在系统提示中允许该来源的「安装未知应用」。也可用 adb：

          ```bash
          adb install -r __ASSET_ANDROID_ARM64__
          ```

          四个 APK 共用同一把发布私钥、同一 `applicationId`，**可以直接覆盖安装升级**，设置页的 Keystore 凭据与应用私有目录里的课表快照都会保留。不要先卸载再装新版（会清掉凭据与快照）。

          > [!IMPORTANT]
          > 发布签名证书 **SHA-256 指纹**：`__ANDROID_CERT_SHA256__`
          >
          > 这是公钥指纹，可公开用于核对 APK 是否确由本仓库发布。若从第三方渠道拿到 APK，可用
          > `apksigner verify --print-certs <文件>` 比对；指纹不一致时**不要安装**，也不要在里面填任何凭据。

          > [!NOTE]
          > 本仓库只发 GitHub Releases 的侧载 APK，不上架应用商店，不自动检查更新；
          > 可在「设置 → 关于 → 检查更新」手动对比版本号。升级请回到本页下载同架构的新版 APK 覆盖安装。

          ### skill

          解压 zip，把 `kemaolife/` 放进所用 agent 的 skills 目录。skill 依赖同机已安装的 `kemaolife` 二进制，本身不带二进制、不带凭据；存放位置（D2）尚未定稿，由使用者决定。

          ### 使用须知

          - 电费数据约 1 天延迟，输出中的「数据截至」是采集时刻，不是实时值。
          - 课表查询每次先联网刷新，失败回落旧快照并标 `stale:true` + `syncedAt`。
          - CLI 不提供校园网状态查询，也不存校园网凭据；Android 校园网动作全手动、无后台。
          - 只查本人数据；请勿在 Issue / 交流群提交学号、密码、Cookie 或课表快照。

          ### 变更清单

          以下由 GitHub 依据本次 tag 与上一次 release 之间的 PR / 提交自动生成。
          EOF

          "$PY" - <<'PY'
          import os

          version = os.environ["VERSION"]
          values = {
              "__TAG__": os.environ["TAG"],
              "__VERSION__": version,
              "__VERSION_CODE__": os.environ["VERSION_CODE"],
              "__SHORT_SHA__": os.environ["SHORT_SHA"],
              "__ANDROID_CERT_SHA256__": os.environ["ANDROID_CERT_SHA256"],
              "__ASSET_AMD64__": f"kemaolife_{version}_linux_amd64.tar.gz",
              "__ASSET_ARM64__": f"kemaolife_{version}_linux_arm64.tar.gz",
              "__ASSET_ARMV7__": f"kemaolife_{version}_linux_armv7.tar.gz",
              "__ASSET_DARWIN_AMD64__": f"kemaolife_{version}_darwin_amd64.tar.gz",
              "__ASSET_DARWIN_ARM64__": f"kemaolife_{version}_darwin_arm64.tar.gz",
              "__ASSET_WIN_AMD64__": f"kemaolife-agent_{version}_windows_amd64.zip",
              "__ASSET_WIN_ARM64__": f"kemaolife-agent_{version}_windows_arm64.zip",
              "__ASSET_ANDROID_ARMV7A__": f"kemaolife_{version}_android_armeabi-v7a.apk",
              "__ASSET_ANDROID_ARM64__": f"kemaolife_{version}_android_arm64-v8a.apk",
              "__ASSET_ANDROID_X86__": f"kemaolife_{version}_android_x86.apk",
              "__ASSET_ANDROID_X86_64__": f"kemaolife_{version}_android_x86_64.apk",
              "__ASSET_SKILL__": f"kemaolife-skill_{version}.zip",
          }
          path = "dist/RELEASE_NOTES.md"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          for key, value in values.items():
              text = text.replace(key, value)
          assert "__" not in text, "模板占位符未全部替换"
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"{path} 已生成，{len(text)} 字符")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.TAG }}
          VERSION: ${{ steps.meta.outputs.VERSION }}
        run: |
          set -euo pipefail
          ASSETS=(
            "dist/kemaolife_${VERSION}_linux_amd64.tar.gz"
            "dist/kemaolife_${VERSION}_linux_arm64.tar.gz"
            "dist/kemaolife_${VERSION}_linux_armv7.tar.gz"
            "dist/kemaolife_${VERSION}_darwin_amd64.tar.gz"
            "dist/kemaolife_${VERSION}_darwin_arm64.tar.gz"
            "dist/kemaolife-agent_${VERSION}_windows_amd64.zip"
            "dist/kemaolife-agent_${VERSION}_windows_arm64.zip"
            "dist/kemaolife_${VERSION}_android_armeabi-v7a.apk"
            "dist/kemaolife_${VERSION}_android_arm64-v8a.apk"
            "dist/kemaolife_${VERSION}_android_x86.apk"
            "dist/kemaolife_${VERSION}_android_x86_64.apk"
            "dist/kemaolife-skill_${VERSION}.zip"
            "dist/SHA256SUMS"
          )
          for asset in "${ASSETS[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::缺少资产 $asset"
              exit 1
            fi
          done

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，只补传同名资产"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            # --notes-file 提供固定说明，--generate-notes 追加 GitHub 自动生成的变更清单。
            gh release create "$TAG" \
              --verify-tag \
              --title "kemaolife $TAG" \
              --notes-file dist/RELEASE_NOTES.md \
              --generate-notes \
              "${ASSETS[@]}"
          fi
