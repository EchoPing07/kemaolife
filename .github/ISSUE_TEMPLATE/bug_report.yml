name: 问题报告
description: 报告可复现的缺陷或回归（不含真实数据与凭据）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。请勿粘贴真实学号、姓名、宿舍房间号、密码、Cookie、课表快照、会话值、本机 MAC 或 `roomverify`；一律用占位符，例如 `<学号>`、`<密码>`、`<roomverify>`。学校代码（`3126`）与学校公开的 Portal / 探测 IP 属协议事实，可保留。
        复现步骤请用本地夹具或 `httptest` 描述，不要要求维护者使用真实账号访问学校系统。

  - type: dropdown
    id: platform
    attributes:
      label: 涉及端
      description: 可多选时请在补充说明里列出
      options:
        - Linux CLI
        - Windows 托盘
        - Android App
        - core / 共享契约
        - 文档 / 协议
        - 尚未实现（设计阶段问题）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 二进制版本或 commit hash；设计阶段填 `未实现`
      placeholder: "v0.1.0 或 <commit>，设计阶段填 未实现"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 问题出现在什么场景，关联的 R 项 / 文档章节 / 命令或 op
      placeholder: "例：执行 `<命令>` 查询电费时……（见 docs/002-功能规格.md §1）"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 用编号列表，步骤中的敏感值一律占位符
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 按 `docs/` 契约应出现的行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 只描述错误类别、退出码 / error.code、耗时与状态码，不贴响应体原文
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 输出（已脱敏）
      description: 可选。只允许贴脱敏后的错误类别与状态码，禁止贴凭据、Cookie、快照内容或个人信息
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我已移除所有真实个人信息、凭据、会话值与快照内容，示例均为占位符
          required: true
        - label: 我未使用真实学校接口或非本人数据复现问题
          required: true
        - label: 我已阅读 CODE_OF_CONDUCT.md，讨论将聚焦问题本身
          required: true
