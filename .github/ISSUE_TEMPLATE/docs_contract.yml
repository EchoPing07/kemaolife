name: 文档与契约
description: 报告文档错误、契约不一致，或协议证据与实测冲突
title: "[docs] "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        对外契约以 [docs/contract.md](https://github.com/EchoPing07/kemaolife/blob/main/docs/contract.md) 为准，协议事实只以 `api-docs/` 为准。若协议与实测不一致，请指出具体条目与差异，**不要自行纠偏或改写协议文档**。
        所有示例值必须是占位符，`api-docs/**` 的示例代码必须是 Go。

  - type: dropdown
    id: scope
    attributes:
      label: 范围
      options:
        - docs/contract.md 对外契约
        - docs/architecture.md 架构
        - docs/cli.md · windows.md · android.md 端文档
        - docs/release.md 构建与发布
        - docs/privacy.md 隐私与合规
        - api-docs/001 课表协议
        - api-docs/002 电费协议
        - api-docs/003 校园网协议
        - api-docs/004 取件码深链
        - README / CONTRIBUTING / 模板
        - 跨文档不一致
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 位置
      description: 文件路径 + 章节 / 行号
      placeholder: "例：docs/contract.md §5 JSON 信封"
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: 问题
      description: 现状写什么、与哪一处契约 / 协议证据冲突
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议改法
      description: 只写结论与理由；涉及契约字段时说明三端如何同步
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据（已脱敏）
      description: 可选。可引用文档条目或本地夹具；禁止粘贴真实响应体、Cookie、凭据、内网地址
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 内容不含真实个人信息、凭据或会话值（学校代码与协议 IP 除外）
          required: true