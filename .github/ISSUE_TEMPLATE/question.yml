name: 使用疑问
description: 用法、范围或工具链疑问（缺陷请用问题报告，新能力请用功能建议）
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        先查 [README](https://github.com/EchoPing07/kemaolife/blob/main/README.md) 与对应端文档（[CLI](https://github.com/EchoPing07/kemaolife/blob/main/docs/cli.md) / [Windows](https://github.com/EchoPing07/kemaolife/blob/main/docs/windows.md) / [Android](https://github.com/EchoPing07/kemaolife/blob/main/docs/android.md)）。
        若是可复现的缺陷请用「问题报告」，若是明确的新能力请用「功能建议」。

  - type: input
    id: reference
    attributes:
      label: 关联位置
      description: 文档章节 / 命令或 op / 已有 Issue
      placeholder: "例：docs/contract.md §6、timetable.week 或 #12"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 想确认什么，为什么现有文档不足以判断
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 候选方案与影响（可选）
      description: 若涉及行为变更：逐条列出候选、对三端 / 契约 / 工具链的影响；工具链或第三方依赖变更需单独确认
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 内容不含真实个人信息、凭据或会话值（学校代码与协议 IP 除外）
          required: true
        - label: 我已阅读 CODE_OF_CONDUCT.md，讨论将聚焦问题本身
          required: true